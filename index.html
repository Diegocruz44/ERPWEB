<div id="loading-screen">
    <div class="spinner"></div>
    <p>Carregando...</p>
</div>

<div id="content" style="display:none;">
    <h1>Conteúdo da página</h1>
</div>
<style>
    #loading-screen {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: white;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        z-index: 9999;
    }

    .spinner {
        border: 16px solid #f3f3f3;
        border-top: 16px solid #3498db;
        border-radius: 50%;
        width: 120px;
        height: 120px;
        animation: spin 2s linear infinite;
    }

    @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
    }

 Carregando...spinner {

// Tempo para o loading desaparecer (em ms)
setTimeout(() => {
    document.getElementById("loading-screen").style.display = "none";
    document.getElementById("content").style.display = "block";
}, 3000); // 3 segundos


<div class="login-container">
    <h2>Login</h2>
    <input type="text" id="username" placeholder="Usuário">
    <input type="password" id="password" placeholder="Senha">
    <button onclick="login()">Entrar</button>

    <p id="login-status"></p>
</div>

.login-container {
    width: 300px;
    padding: 20px;
    margin: 100px auto;
    background: #222;
    border-radius: 10px;
    box-shadow: 0 0 15px rgba(0,0,0,0.4);
    text-align: center;
    color: white;
    font-family: Arial;
}

.login-container input {
    width: 90%;
    padding: 10px;
    margin: 10px 0;
    border: none;
    border-radius: 5px;
}

.login-container button {
    width: 95%;
    padding: 10px;
    background: #00ffcc;
    border: none;
    border-radius: 5px;
    cursor: pointer;
    color: #111;
    font-weight: bold;
}

.login-container button:hover {
    background: #00caa3;
}

#login-status {

function login() {
    const user = document.getElementById("username").value;
    const pass = document.getElementById("password").value;

    // Exemplo simples (apenas para demonstração)
    const userCorreto = "admin";
    const passCorreto = "1234";

    if (user === userCorreto && pass === passCorreto) {
        document.getElementById("login-status").innerText = "Login bem-sucedido!";
        document.getElementById("login-status").style.color = "lightgreen";
    } else {
        document.getElementById("login-status").innerText = "Usuário ou senha incorretos!";
        document.getElementById("login-status").style.color = "red";
    }
}
